<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineering – Health &amp; Safety KPI Dashboard</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
/* Shared appearance for the university and faculty/service KPI dashboards.
   Inlined into each generated page by scripts/faculty_dashboard.py. */
:root{
  --ink:#0f172a;
  --ink-2:#334155;
  --ink-3:#64748b;
  --ink-4:#94a3b8;
  --line:#e2e8f0;
  --line-2:#cbd5e1;
  --page:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --brand:#10294a;
  --brand-2:#1b3d6b;
  --accent:#2563eb;
  --accent-soft:#eff4ff;
  /* Performance bands (thresholds unchanged: 95 / 80 / 60). */
  --band-excellent:#2563eb;--band-excellent-bg:#eaf1fe;--band-excellent-ink:#1e40af;
  --band-good:#059669;--band-good-bg:#e6f6f0;--band-good-ink:#065f46;
  --band-warning:#e08a00;--band-warning-bg:#fdf3e1;--band-warning-ink:#8a4b00;
  --band-poor:#dc2626;--band-poor-bg:#fdecec;--band-poor-ink:#991b1b;
  --band-na:#94a3b8;--band-na-bg:#f1f5f9;--band-na-ink:#475569;
  --missing:#be123c;--missing-bg:#fff1f3;--missing-line:#fecdd3;
  --up:#047857;--up-bg:#e7f6ef;
  --down:#b91c1c;--down-bg:#fdecec;
  --radius:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow-hover:0 4px 14px rgba(15,23,42,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--page);color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh;font-feature-settings:'tnum' 1,'cv11' 1}
button{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.page-header{background:linear-gradient(120deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff}
.page-header-inner{max-width:1440px;margin:0 auto;padding:28px 32px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.breadcrumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#bcd0ea;text-decoration:none;margin-bottom:10px;font-weight:500}
.breadcrumb:hover{color:#fff;text-decoration:underline}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9fb8d9;font-weight:600;margin-bottom:6px}
.page-header h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.header-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px;font-size:14px;color:#d5e2f3}
.header-meta strong{color:#fff;font-weight:600}
.header-actions{display:flex;gap:8px}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-ghost:hover{background:rgba(255,255,255,.18)}
.btn-ghost:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn-ghost svg{width:16px;height:16px}

.container{max-width:1440px;margin:0 auto;padding:24px 32px 48px}

/* ---------- At a glance ---------- */
.glance{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.glance-bands{padding:18px 20px}
.panel-title{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.panel-title .panel-title-note{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-4)}
.band-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.band-tile{border-radius:10px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .15s,background .15s;width:100%}
.band-tile:hover:not(:disabled){border-color:var(--band-color);box-shadow:var(--shadow-hover)}
.band-tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band-tile:disabled{cursor:default;opacity:.6}
.band-tile.selected{border-color:var(--band-color);box-shadow:0 0 0 1px var(--band-color) inset,var(--shadow-hover);background:var(--surface)}
.band-tile.selected::after{content:'✓';position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--band-color);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.band-tiles.filtering .band-tile:not(.selected){opacity:.55}
.band-tiles.filtering .band-tile:not(.selected):hover:not(:disabled){opacity:1}
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px;margin-bottom:14px;background:var(--accent-soft);border:1px solid #cddbfb;border-radius:10px;font-size:14px;color:var(--ink-2)}
.filter-bar[hidden]{display:none}
.filter-label{margin-right:4px}
.filter-chip{border:none;cursor:pointer;font-size:13px;padding:4px 10px}
.filter-chip span{margin-left:2px;font-size:15px;line-height:1;opacity:.7}
.filter-chip:hover span{opacity:1}
.filter-clear{margin-left:auto;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.filter-clear:hover{background:#fff;border-color:var(--accent)}
.band-tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--band-color)}
.band-tile-count{font-size:28px;font-weight:700;line-height:1.1;color:var(--ink)}
.band-tile-count small{font-size:14px;font-weight:500;color:var(--ink-3);margin-left:2px}
.band-tile-label{font-size:13px;color:var(--ink-2);font-weight:600;margin-top:2px}
.band-tile-range{font-size:12px;color:var(--ink-3)}
.band-excellent{--band-color:var(--band-excellent)}
.band-good{--band-color:var(--band-good)}
.band-warning{--band-color:var(--band-warning)}
.band-poor{--band-color:var(--band-poor)}
.band-na{--band-color:var(--band-na)}
.band-distribution{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;margin-top:14px;background:var(--line)}
.band-distribution span{display:block;height:100%;background:var(--band-color)}
.glance-note{font-size:12px;color:var(--ink-3);margin-top:10px}
.glance-stats{padding:18px 20px;display:flex;flex-direction:column}
.stat-list{display:flex;flex-direction:column;gap:2px;flex:1}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.stat-label .stat-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:700}
.stat-icon.up{background:var(--up-bg);color:var(--up)}
.stat-icon.down{background:var(--down-bg);color:var(--down)}
.stat-icon.above{background:var(--band-excellent-bg);color:var(--band-excellent-ink)}
.stat-icon.missing{background:var(--missing-bg);color:var(--missing)}
.stat-value{font-size:18px;font-weight:700;color:var(--ink);white-space:nowrap}
.stat-value small{font-size:13px;color:var(--ink-3);font-weight:500}
.stat-row.has-sub{border-bottom:none}
.stat-sub{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 12px 30px}
.unit-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--missing-bg);border:1px solid var(--missing-line);color:var(--missing);font-size:13px;font-weight:600;line-height:1.3}
.unit-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--missing)}

/* ---------- Toolbar ---------- */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.section-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.section-sub{font-size:14px;color:var(--ink-3);margin-top:2px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.toolbar-label{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.segmented{display:inline-flex;background:#e9edf3;border-radius:9px;padding:3px;gap:2px}
.segmented button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;transition:background .15s,color .15s}
.segmented button:hover{color:var(--ink)}
.segmented button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.segmented button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- KPI cards (detailed view) ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 0;position:relative;transition:box-shadow .15s,border-color .15s;cursor:pointer;border-top:3px solid var(--band-color,var(--line))}
.kpi-card:hover{box-shadow:var(--shadow-hover);border-color:var(--line-2);border-top-color:var(--band-color,var(--line-2))}
.kpi-card.no-return-current{--band-color:var(--missing)}
.kpi-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kpi-title-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.kpi-title{font-size:16px;font-weight:700;color:var(--ink);line-height:1.3}
.kpi-flags{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi-question{font-size:13px;color:var(--ink-3);line-height:1.4;margin-top:4px;min-height:36px}
.kpi-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-top:14px}
.kpi-hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi-hero-value{font-size:36px;line-height:1;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.kpi-hero-sub{font-size:13px;color:var(--ink-3);margin-top:6px}
.kpi-state{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink-2);padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line-2);line-height:1.35}
.kpi-state.state-missing{background:var(--missing-bg);border:1px solid var(--missing-line);color:var(--missing)}
.kpi-state.state-exceeded{background:var(--band-good-bg);border:1px solid #b7e4d3;color:var(--band-good-ink)}
.band-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--chip-bg);color:var(--chip-ink)}
.band-chip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--band-color)}
.band-chip.band-excellent{--chip-bg:var(--band-excellent-bg);--chip-ink:var(--band-excellent-ink)}
.band-chip.band-good{--chip-bg:var(--band-good-bg);--chip-ink:var(--band-good-ink)}
.band-chip.band-warning{--chip-bg:var(--band-warning-bg);--chip-ink:var(--band-warning-ink)}
.band-chip.band-poor{--chip-bg:var(--band-poor-bg);--chip-ink:var(--band-poor-ink)}
.kpi-meter{position:relative;height:8px;border-radius:999px;background:#eef1f5;margin:16px 0 6px}
.kpi-meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--band-color)}
.kpi-meter-marker{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px;transform:translateX(-1px)}
.kpi-meter-marker::after{content:attr(data-label);position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.kpi-deltas{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.delta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.delta .delta-label{font-weight:500;color:var(--ink-3)}
.delta.above{background:var(--band-excellent-bg);color:var(--band-excellent-ink);border-color:transparent}
.delta.below{background:var(--band-poor-bg);color:var(--band-poor-ink);border-color:transparent}
.delta.equal,.delta.unavailable{background:var(--surface-2);color:var(--ink-3)}
.delta.above .delta-label,.delta.below .delta-label{color:inherit;opacity:.8}

/* Change badges (movement since the last applicable return). */
.change-badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;width:fit-content;white-space:nowrap;border:1px solid transparent;line-height:1.3}
.change-up{background:var(--up-bg);color:var(--up)}
.change-down{background:var(--down-bg);color:var(--down)}
.change-flat{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.change-na{background:var(--band-na-bg);color:var(--band-na-ink)}
.change-missing{background:var(--missing-bg);color:var(--missing)}
.change-prev-submitted{background:#ecfeff;color:#155e75}
.change-prev-missing{background:var(--missing-bg);color:var(--missing)}

/* Status markers */
.missing-return-flag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--missing-bg);border:1px solid var(--missing-line);color:var(--missing);font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap}
.missing-return-flag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--missing)}
.no-return{display:inline-flex;align-items:center;gap:6px;color:var(--missing);font-weight:600;white-space:nowrap}
.no-return::before{content:'!';display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--missing);color:#fff;font-size:11px;font-weight:800;flex:0 0 16px}
.no-prior{display:inline-flex;align-items:center;gap:4px;color:#1e40af;font-weight:600}
.exceeded-badge{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--band-good-ink)}
.data-warning{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#b45309;color:#fff;font-size:11px;font-weight:800;cursor:help;flex:0 0 18px}
.school-warning{margin-left:6px;vertical-align:middle}

/* Info buttons */
.info-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);border-radius:999px;height:26px;padding:0 10px 0 7px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.info-btn svg{width:15px;height:15px}
.info-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:#bfd2fb}
.info-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.info-btn.icon-only{width:22px;height:22px;padding:0;border-color:transparent;background:transparent;vertical-align:middle}
.info-btn.icon-only:hover{background:var(--accent-soft)}

/* Trend chart */
.trend-wrap{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.trend-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.trend-title{font-size:13px;color:var(--ink-2);font-weight:600}
.trend-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.trend-legend span{display:inline-flex;align-items:center;gap:6px}
.legend-line{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink-4)}
.legend-line.dashed{border-top-style:dashed}
.legend-line.split{border-top:none;height:2px;background:linear-gradient(90deg,#059669 0 50%,#dc2626 50% 100%)}
.legend-line.solid-blue{border-top-color:var(--accent)}
.trend-canvas-box{position:relative;height:170px;width:100%}

/* Card footer / expand control */
.card-footer{display:flex;justify-content:center;border-top:1px solid var(--line);margin:16px -20px 0;padding:0}
.expand-btn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:none;padding:10px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;border-radius:0 0 var(--radius) var(--radius)}
.expand-btn:hover{background:var(--accent-soft)}
.expand-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.expand-btn .chev{transition:transform .2s;display:inline-block}
.kpi-card.expanded .expand-btn .chev{transform:rotate(180deg)}
.expand-btn .when-open{display:none}
.kpi-card.expanded .expand-btn .when-open{display:inline}
.kpi-card.expanded .expand-btn .when-closed{display:none}
.card-footer-spacer{height:18px}

/* ---------- Breakdown (detailed view) ---------- */
.school-breakdown-content{display:none}
.kpi-card.expanded .school-breakdown-content{display:block;margin:0 -20px;padding:14px 20px 4px;background:var(--surface-2);border-top:1px solid var(--line)}
.school-breakdown-title{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.school-list{display:flex;flex-direction:column}
.school-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 250px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.school-row:last-child{border-bottom:none}
.school-name{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.school-count{font-size:12px;color:var(--ink-3);font-weight:400;margin-top:1px}
.school-measure{display:flex;align-items:center;gap:10px;min-width:0}
.bar-track{flex:1;height:10px;border-radius:999px;background:#e6eaf0;position:relative;overflow:hidden;min-width:60px}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar-value{font-size:14px;font-weight:700;color:var(--ink);min-width:58px;text-align:right}
.school-state{font-size:13px;color:var(--ink-3);font-style:italic;line-height:1.4}
.school-state .no-return{font-style:normal}
.school-state.state-exceeded{color:var(--band-good-ink);font-style:normal;font-weight:600}
.school-trend{display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0}
.school-trend-inline{display:flex;align-items:center;gap:10px;justify-content:flex-start;width:100%}
.spark-box{position:relative;width:84px;height:28px;flex:0 0 84px}
.school-trend-empty{font-size:12px;color:var(--ink-4)}
.school-trend .change-badge{font-size:12px;padding:3px 9px;white-space:nowrap}

/* ---------- Compact view ---------- */
.compact-head{display:none}
.compressed-view .compact-head{display:grid;grid-template-columns:var(--compact-cols);gap:16px;padding:0 20px 8px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.compressed-view .kpi-grid{grid-template-columns:1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.faculty-overview{--compact-cols:minmax(0,1.4fr) minmax(0,1.2fr) 200px 170px 28px}
.faculty-overview.is-university{--compact-cols:minmax(0,1.6fr) minmax(0,1.4fr) 200px 28px}
.compressed-view .kpi-card{display:grid;grid-template-columns:var(--compact-cols);gap:16px;align-items:center;border:none;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line);padding:12px 20px;border-left:4px solid var(--band-color,var(--line-2));border-top:none}
.compressed-view .kpi-card:last-child{border-bottom:none}
.compressed-view .kpi-card:hover{background:#fbfcfe;box-shadow:none}
.compressed-view .kpi-head{display:contents}
.compressed-view .kpi-title{font-size:14px}
.compressed-view .kpi-question,.compressed-view .trend-wrap,.compressed-view .kpi-meter,.compressed-view .card-footer-spacer{display:none}
.compressed-view .kpi-body{display:contents}
.compressed-view .kpi-hero-value{font-size:20px}
.compressed-view .kpi-hero{gap:8px}
.compressed-view .kpi-hero-sub{margin-top:2px;font-size:12px}
.compressed-view .kpi-state{font-size:13px;padding:6px 10px}
.compressed-view .kpi-deltas{display:contents}

.compressed-view .card-footer{border:none;margin:0;justify-content:flex-end}
.compressed-view .expand-btn{width:28px;height:28px;padding:0;border-radius:6px;color:var(--ink-3);font-size:18px}
.compressed-view .expand-btn:hover{background:var(--accent-soft);color:var(--accent)}
.compressed-view .expand-btn .expand-text{display:none}
.compressed-view .school-breakdown-content{grid-column:1/-1}
.compressed-view .kpi-card.expanded .school-breakdown-content{margin:6px -20px -12px -24px;padding:14px 20px 14px 24px;overflow-x:auto}
.compressed-school-table{display:flex;flex-direction:column;min-width:640px}
.compressed-school-row{display:grid;grid-template-columns:minmax(170px,2fr) minmax(130px,1.2fr) minmax(100px,.9fr) minmax(100px,.9fr) minmax(120px,1fr);gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.compressed-school-row:last-child{border-bottom:none}
.compressed-school-row.header{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding-top:0}
.compressed-school-row .school-name{font-size:13px}
.compressed-school-row{padding-left:12px!important}
.compressed-school-row:not(.header):not(.no-return-row){box-shadow:inset 3px 0 0 var(--band-color)}
.compressed-school-row .school-prev{color:var(--ink-3)}
.compressed-school-row .school-current{font-weight:700;color:var(--ink)}
.pct-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct-chip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--band-color);flex:0 0 8px}
.pct-prev{color:var(--ink-3);font-weight:500}
.pct-prev::before{opacity:.55}
.pct-current{padding:3px 10px 3px 8px;font-weight:700;font-size:13px}
.pct-current.band-excellent{background:var(--band-excellent-bg);color:var(--band-excellent-ink)}
.pct-current.band-good{background:var(--band-good-bg);color:var(--band-good-ink)}
.pct-current.band-warning{background:var(--band-warning-bg);color:var(--band-warning-ink)}
.pct-current.band-poor{background:var(--band-poor-bg);color:var(--band-poor-ink)}
.compressed-school-row .school-change{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.compressed-school-row .up{color:#fff;background:#059669}
.compressed-school-row .down{color:#fff;background:#dc2626}
.compressed-school-row .flat{color:var(--ink-3);background:#eef1f5}
.compressed-school-row .na{color:var(--band-na-ink);background:var(--band-na-bg)}
.compressed-school-row .cell-no-return{color:var(--missing);font-weight:600;font-style:italic}
.compressed-school-row .cell-no-prior{color:#1e40af;font-style:italic;display:inline-flex;align-items:center}
.compressed-school-row .cell-exceeded{color:var(--ink-3);font-style:italic}
.compressed-school-row.no-return-row{grid-template-columns:minmax(170px,2fr) minmax(0,4fr);background:var(--missing-bg);border-radius:6px;border-bottom-color:transparent;margin:2px 0}
.compressed-school-row .row-no-return-msg{color:var(--missing);font-weight:600;font-style:italic}

/* ---------- Info dialog ---------- */
.info-dialog{border:none;border-radius:14px;padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 24px 60px rgba(15,23,42,.3);color:var(--ink);margin:auto}
.info-dialog::backdrop{background:rgba(15,23,42,.45)}
.info-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.info-dialog-eyebrow{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.info-dialog-title{font-size:20px;font-weight:700;line-height:1.25}
.info-close{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1;color:var(--ink-3);flex:0 0 34px}
.info-close:hover{background:var(--line);color:var(--ink)}
.info-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.info-dialog-body{padding:18px 24px 24px;overflow:auto}
.info-section+.info-section{margin-top:18px}
.info-section h3{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.info-section p{font-size:15px;line-height:1.6;color:var(--ink-2)}
.info-section p+p{margin-top:10px}
.info-lead{font-size:16px!important;color:var(--ink)!important;font-weight:500}
.info-facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.info-facts dt{color:var(--ink-3)}
.info-facts dd{color:var(--ink);font-weight:500}
.guide-steps{display:flex;flex-direction:column;gap:10px;list-style:none;counter-reset:step}
.guide-steps li{position:relative;display:block;padding-left:36px;min-height:24px;font-size:15px;line-height:1.55;color:var(--ink-2)}
.guide-steps li strong{color:var(--ink);font-weight:600}
.guide-steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.guide-key{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;align-items:center;font-size:14px;line-height:1.4;color:var(--ink-2)}
.guide-key>*:nth-child(odd){justify-self:start}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .glance{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .compressed-view .compact-head{display:none}
  .compressed-view .kpi-card{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .compressed-view .kpi-title-wrap{grid-column:1/2}
  .compressed-view .card-footer{grid-column:2/3;grid-row:1}
  .compressed-view .kpi-hero-wrap{grid-column:1/-1}
  .compressed-view .col-uni,.compressed-view .col-change{grid-column:1/-1}
}
@media (max-width:720px){
  .page-header-inner{padding:20px 16px}
  .page-header h1{font-size:24px}
  .container{padding:16px 16px 40px}
  .band-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-card{padding:16px 16px 0}
  .card-footer,.kpi-card.expanded .school-breakdown-content{margin-left:-16px;margin-right:-16px}
  .kpi-card.expanded .school-breakdown-content{padding-left:16px;padding-right:16px}
  .kpi-body{grid-template-columns:1fr}
  .kpi-deltas{align-items:flex-start}
  .kpi-hero-value{font-size:30px}
  .school-row{grid-template-columns:1fr;gap:6px}
  .school-trend,.school-trend-inline{justify-content:flex-start}
  .section-head{align-items:flex-start}
}

/* ---------- Print ---------- */
@media print{
  body{background:#fff;font-size:12px}
  .page-header{background:none;color:var(--ink);border-bottom:2px solid var(--ink)}
  .page-header .eyebrow,.page-header .header-meta{color:var(--ink-3)}
  .page-header .header-meta strong{color:var(--ink)}
  .header-actions,.toolbar,.breadcrumb,.card-footer,.info-btn{display:none!important}
  .panel,.kpi-card{box-shadow:none;break-inside:avoid}
  .container{padding:12px 0}
}

<div class="info-section">
<ol class="guide-steps">
<li>The large figure on each card is this period's result. The line beneath it shows how many items were in scope.</li>
<li>The coloured bar and band label show the performance band. The black “Uni” marker shows the university average.</li>
<li>“vs university” shows the gap to the university average in percentage points (pp). “Since last return” shows movement since the last applicable return.</li>
<li>Select <strong>Show … schools / departments</strong> on a card to see each school or department with its own trend.</li>
<li>Select <strong>About</strong> beside a KPI title to read its full definition and guidance.</li>
<li><em>Not applicable</em> means 0 items were scheduled or in scope this period, so the KPI is excluded from change calculations.</li>
</ol>
</div>
<div class="info-section">

<p>Values above 100% can occur when more tasks were completed than planned, or where source data was entered incorrectly.</p>

}
function getUniversityMarker(kpiData){
  if(kpiData.is_university === true) return null;
  if(kpiData.applicable===false||kpiData.university_applicable===false) return null;
  if(typeof kpiData.percentage !== 'number' || typeof kpiData.university_percentage !== 'number') return null;
  if(!['above','below','equal'].includes(kpiData.comparison)) return null;
  return kpiData.university_percentage;
}
// Split the existing display text into a headline value and its supporting detail.
function buildHeroMarkup(kpiName,kpiData,performanceClass){
  const display = formatDisplayTextWithCount(kpiName, kpiData.percentage, kpiData.number, kpiData.applicable, kpiData.exceeded, kpiData.completed_count);
  const match = /^(-?\d+(?:\.\d+)?%)(?: \((.*)\))?$/.exec(String(display).trim());
  if(match){
    const band = BAND_INFO[performanceClass] || BAND_INFO['performance-no-data'];
    const chip = `<span class="band-chip ${band.cls}" title="${band.name}: ${band.label}">${band.name}</span>`;
    const sub = match[2] ? `<div class="kpi-hero-sub">${match[2].charAt(0).toUpperCase() + match[2].slice(1)}</div>` : '';
    return { numeric: true, html: `<div class="kpi-hero"><span class="kpi-hero-value num">${match[1]}</span>${chip}</div>${sub}` };
  }
  let stateClass = '';
  if(display.includes('no-return')) stateClass = 'state-missing';
  else if(display.includes('exceeded-badge')) stateClass = 'state-exceeded';
  return { numeric: false, html: `<div class="kpi-state ${stateClass}">${display}</div>` };
}
function buildMeterMarkup(kpiData,performanceClass){
  if(typeof kpiData.percentage !== 'number' || kpiData.applicable === false) return '';
  const band = BAND_INFO[performanceClass];
  if(!band || band.cls === 'band-na') return '';
  const width = Math.max(0, Math.min(100, kpiData.percentage));
  const uni = getUniversityMarker(kpiData);
  const marker = uni === null ? '' : `<div class="kpi-meter-marker" style="left:${Math.max(0, Math.min(100, uni))}%" data-label="Uni" title="University: ${uni.toFixed(1)}%"></div>`;
  return `<div class="kpi-meter ${band.cls}" role="img" aria-label="${kpiData.percentage.toFixed(1)} percent"><div class="kpi-meter-fill" style="width:${width}%"></div>${marker}</div>`;
}
function pluralise(count, singular, plural){
  return `${count} ${count === 1 ? singular : plural}`;
}
function toggleCard(cardElement,kpiName){
  cardElement.classList.toggle('expanded');
  const button = cardElement.querySelector('.expand-btn');
  if(button) button.setAttribute('aria-expanded', cardElement.classList.contains('expanded') ? 'true' : 'false');
  if(cardElement.classList.contains('expanded')) setTimeout(renderSchoolTrendCharts, 0);
}
function refreshDashboard(){
  initializeFacultyDashboard();
  setTimeout(()=>{positionTooltips();applyCompressedValueTitles();renderTrendCharts();renderSchoolTrendCharts();},50);
}
function sortFacultyCards(order){
  currentSortOrder=order;
  document.getElementById('sortHighLow').classList.toggle('active',order==='highLow');
  document.getElementById('sortLowHigh').classList.toggle('active',order==='lowHigh');
  document.getElementById('sortHighLow').setAttribute('aria-pressed',order==='highLow');
  document.getElementById('sortLowHigh').setAttribute('aria-pressed',order==='lowHigh');
  refreshDashboard();
}
function toggleViewMode(mode){
  currentViewMode=mode;
  document.getElementById('detailedView').classList.toggle('active',mode==='detailed');
  document.getElementById('compressedView').classList.toggle('active',mode==='compressed');
  document.getElementById('detailedView').setAttribute('aria-pressed',mode==='detailed');
  document.getElementById('compressedView').setAttribute('aria-pressed',mode==='compressed');
  const container=document.querySelector('.faculty-overview');
  const instructions=document.getElementById('instructions');
  if(mode==='compressed'){
    container.classList.add('compressed-view');
    instructions.textContent=DASHBOARD_CONFIG.compactHint;
  } else {
    container.classList.remove('compressed-view');
    instructions.textContent=DASHBOARD_CONFIG.detailedHint;
  }
  refreshDashboard();
}
function renderHeaderMeta(){
  const meta = document.getElementById('headerMeta');
  if(!meta || !facultyData.kpis) return;
  let dates = [];
  Object.values(facultyData.kpis).forEach((kpi) => {
    const history = normalizeTrendHistory(kpi.history);
    if(history.length > dates.length) dates = history.map((point) => point.date);
  });
  const parts = [];
  if(dates.length > 0) parts.push(`<span>Latest return: <strong>${escapeHtml(formatReportDate(dates[dates.length - 1]))}</strong></span>`);
  if(dates.length > 1) parts.push(`<span>Trend covers <strong>${dates.length} reporting periods</strong> from ${escapeHtml(formatReportDate(dates[0]))}</span>`);
  parts.push(`<span><strong>${Object.keys(facultyData.kpis).length}</strong> KPIs</span>`);
  meta.innerHTML = parts.join('');
}
// The band a KPI is counted in on the summary tiles (missing returns are unrated).
function getKpiSummaryBand(kpiName, kpiData){
  const missing = isMissingCurrentForKpi(kpiName, kpiData.percentage, kpiData.number, kpiData.applicable);
  return missing ? 'performance-no-data' : getPerformanceClass(kpiData.percentage, kpiData.applicable);
}
function toggleBandFilter(bandClass){
  if(activeBandFilters.has(bandClass)) activeBandFilters.delete(bandClass); else activeBandFilters.add(bandClass);
  syncBandFilterUi();
  refreshDashboard();
}
function clearBandFilters(){
  activeBandFilters.clear();
  syncBandFilterUi();
  refreshDashboard();
}
function syncBandFilterUi(){
  const filtering = activeBandFilters.size > 0;
  document.querySelectorAll('.band-tile[data-band]').forEach((tile) => {
    const selected = activeBandFilters.has(tile.dataset.band);
    tile.classList.toggle('selected', selected);
    tile.setAttribute('aria-pressed', selected ? 'true' : 'false');
  });
  const tiles = document.querySelector('.band-tiles');
  if(tiles) tiles.classList.toggle('filtering', filtering);
  let bar = document.getElementById('filterBar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'filterBar';
    bar.className = 'filter-bar';
    bar.setAttribute('role', 'status');
    const grid = document.getElementById('facultyKpis');
    const head = document.querySelector('.compact-head');
    grid.parentNode.insertBefore(bar, head || grid);
  }
  if(!filtering){ bar.hidden = true; bar.innerHTML = ''; return; }
  const total = Object.keys(facultyData.kpis || {}).length;
  const shown = Object.entries(facultyData.kpis || {}).filter(([n, k]) => activeBandFilters.has(getKpiSummaryBand(n, k))).length;
  const chips = [...activeBandFilters].map((cls) => {
    const band = BAND_INFO[cls];
    return `<button type="button" class="band-chip ${band.cls} filter-chip" onclick="toggleBandFilter('${cls}')" aria-label="Remove filter: ${band.name}">${band.name}<span aria-hidden="true">×</span></button>`;
  }).join('');
  bar.hidden = false;
  bar.innerHTML = `<span class="filter-label">Showing <strong>${shown}</strong> of ${total} KPIs</span>${chips}<button type="button" class="filter-clear" onclick="clearBandFilters()">Show all KPIs</button>`;
}
function renderSummary(){
  const host = document.getElementById('glance');
  if(!host || !facultyData.kpis) return;
  const kpis = Object.entries(facultyData.kpis);
  const counts = { 'performance-excellent':0, 'performance-good':0, 'performance-warning':0, 'performance-poor':0 };
  let unrated = 0, improved = 0, declined = 0, above = 0, compared = 0;
  kpis.forEach(([kpiName, kpiData]) => {
    const cls = getKpiSummaryBand(kpiName, kpiData);
    if(cls in counts) counts[cls] += 1; else unrated += 1;
    const change = getChangeSummary(kpiData.history, kpiName);
    if(change && change.className === 'change-up') improved += 1;
    if(change && change.className === 'change-down') declined += 1;
    if(!isUniversityDashboard && ['above','below','equal'].includes(kpiData.comparison)){
      compared += 1;
      if(kpiData.comparison === 'above') above += 1;
    }
  });
  const rated = kpis.length - unrated;
  const tiles = Object.entries(counts).map(([cls, count]) => {
    const band = BAND_INFO[cls];
    return `<button type="button" class="band-tile ${band.cls}" data-band="${cls}" aria-pressed="false" ${count === 0 ? 'disabled' : ''} onclick="toggleBandFilter('${cls}')" title="${count === 0 ? 'No KPIs in this band' : `Show only ${band.name} KPIs`}"><div class="band-tile-count num">${count}<small>KPI${count === 1 ? '' : 's'}</small></div><div class="band-tile-label">${band.name}</div><div class="band-tile-range">${band.label}</div></button>`;
  }).join('');
  const distribution = rated > 0
    ? Object.entries(counts).filter(([, c]) => c > 0).map(([cls, c]) => `<span class="${BAND_INFO[cls].cls}" style="flex:${c}" title="${BAND_INFO[cls].label}: ${c}"></span>`).join('')
    : '';
  const unratedNote = unrated > 0 ? `${pluralise(unrated, 'KPI is', 'KPIs are')} not rated this period (not applicable or no return).` : 'All KPIs have a rated value this period.';

  const units = facultyData.schools ? Object.entries(facultyData.schools) : [];
  const noReturnUnits = units.filter(([, unit]) => {
    const entries = Object.entries(unit.kpis || {});
    return entries.length > 0 && entries.every(([kpiName, k]) => isMissingCurrentForKpi(kpiName, k.percentage, k.number, k.applicable));
  }).map(([name]) => name);
  const missingKpiReturns = units.reduce((total, [, unit]) => total + Object.entries(unit.kpis || {}).filter(([kpiName, k]) => isMissingCurrentForKpi(kpiName, k.percentage, k.number, k.applicable)).length, 0);

  let rows = `<div class="stat-row"><span class="stat-label"><span class="stat-icon up">↑</span>Improved since last return</span><span class="stat-value num">${improved}</span></div>`;
  rows += `<div class="stat-row"><span class="stat-label"><span class="stat-icon down">↓</span>Declined since last return</span><span class="stat-value num">${declined}</span></div>`;
  if(!isUniversityDashboard){
    rows += `<div class="stat-row"><span class="stat-label"><span class="stat-icon above">▲</span>Above university average</span><span class="stat-value num">${compared > 0 ? `${above}<small> of ${compared}</small>` : '<small>Not available</small>'}</span></div>`;
  }
  rows += `<div class="stat-row${noReturnUnits.length > 0 ? ' has-sub' : ''}"><span class="stat-label"><span class="stat-icon missing">!</span>${escapeHtml(DASHBOARD_CONFIG.unitTitle)} with no return</span><span class="stat-value num">${noReturnUnits.length}<small> of ${units.length}</small></span></div>`;
  if(noReturnUnits.length > 0) rows += `<div class="stat-sub">${noReturnUnits.map((name) => `<span class="unit-chip">${escapeHtml(name)}</span>`).join('')}</div>`;

  host.innerHTML = `
    <div class="panel glance-bands">
      <div class="panel-title"><span>Current performance</span><span class="panel-title-note">${rated} of ${kpis.length} KPIs rated · select a band to filter</span></div>
      <div class="band-tiles">${tiles}</div>
      <div class="band-distribution" aria-hidden="true">${distribution}</div>
      <div class="glance-note">${unratedNote}${missingKpiReturns > 0 ? ` ${pluralise(missingKpiReturns, 'KPI return is', 'KPI returns are')} missing across ${escapeHtml(DASHBOARD_CONFIG.unitPlural)}.` : ''}</div>
    </div>
    <div class="panel glance-stats">
      <div class="panel-title"><span>At a glance</span></div>
      <div class="stat-list">${rows}</div>
    </div>`;
}
function initializeFacultyDashboard(){
  applyExceededInference();
  const facultyKpisContainer = document.getElementById('facultyKpis');
  facultyKpisContainer.innerHTML = '';
  if(!facultyData.kpis) return;

  let kpiEntries = Object.entries(facultyData.kpis);
  if(currentSortOrder === 'highLow') {
    kpiEntries.sort((a, b) => {
      const aPercentage = a[1].applicable === false || a[1].percentage === null ? -1 : a[1].percentage;
      const bPercentage = b[1].applicable === false || b[1].percentage === null ? -1 : b[1].percentage;
      return bPercentage - aPercentage;
    });
  } else {
    kpiEntries.sort((a, b) => {
      const aPercentage = a[1].applicable === false || a[1].percentage === null ? 999 : a[1].percentage;
      const bPercentage = b[1].applicable === false || b[1].percentage === null ? 999 : b[1].percentage;
      return aPercentage - bPercentage;
    });
  }

  if(activeBandFilters.size > 0){
    kpiEntries = kpiEntries.filter(([kpiName, kpiData]) => activeBandFilters.has(getKpiSummaryBand(kpiName, kpiData)));
  }

  for(const [kpiName, kpiData] of kpiEntries){
    const card = document.createElement('div');
    card.className = 'kpi-card';
    let cardHasMissingReturns = isMissingCurrentForKpi(kpiName, kpiData.percentage, kpiData.number, kpiData.applicable);
    let missingReturnsCount = 0;
    if(cardHasMissingReturns) card.classList.add('no-return-current');
    card.id = `card-${kpiName.replace(/[^a-zA-Z0-9]/g, '-')}`;
    const performanceClass = getPerformanceClass(kpiData.percentage, kpiData.applicable);
    const cardBand = BAND_INFO[performanceClass] || BAND_INFO['performance-no-data'];
    card.classList.add(cardBand.cls);
    let schoolBreakdownHtml = '';
    let schoolCount = 0;

    const hasSchools = facultyData.schools && Object.keys(facultyData.schools).length > 0;
    if(hasSchools){
      let schoolEntries = Object.entries(facultyData.schools).filter(([schoolName, schoolData]) => schoolData.kpis && schoolData.kpis[kpiName]);
      missingReturnsCount = schoolEntries.reduce((count, [, schoolData]) => {
        const schoolKpi = schoolData.kpis[kpiName];
        return count + (isMissingCurrentForKpi(kpiName, schoolKpi.percentage, schoolKpi.number, schoolKpi.applicable) ? 1 : 0);
      }, 0);
      if(missingReturnsCount > 0) cardHasMissingReturns = true;

      if(currentSortOrder === 'highLow') {
        schoolEntries.sort((a, b) => {
          const aPoint = a[1].kpis[kpiName];
          const bPoint = b[1].kpis[kpiName];
          const aPerc = aPoint.applicable === false || aPoint.percentage === null ? -1 : aPoint.percentage;
          const bPerc = bPoint.applicable === false || bPoint.percentage === null ? -1 : bPoint.percentage;
          return bPerc - aPerc;
        });
      } else {
        schoolEntries.sort((a, b) => {
          const aPoint = a[1].kpis[kpiName];
          const bPoint = b[1].kpis[kpiName];
          const aPerc = aPoint.applicable === false || aPoint.percentage === null ? 999 : aPoint.percentage;
          const bPerc = bPoint.applicable === false || bPoint.percentage === null ? 999 : bPoint.percentage;
          return aPerc - bPerc;
        });
      }

      schoolCount = schoolEntries.length;
      if(schoolEntries.length > 0){
        const breakdownTitle = `Breakdown by ${DASHBOARD_CONFIG.unitSingular} (${schoolEntries.length})`;
        schoolBreakdownHtml = `<div class="school-breakdown-content"><div class="school-breakdown-title">${breakdownTitle}</div>`;

        if(currentViewMode === 'compressed'){
          schoolBreakdownHtml += `<div class="compressed-school-table"><div class="compressed-school-row header"><div>${escapeHtml(DASHBOARD_CONFIG.unitColumn)}</div><div>In scope</div><div>Previous</div><div>Current</div><div>Change</div></div>`;
          for(const [schoolName, schoolData] of schoolEntries){
            const schoolKpi = schoolData.kpis[kpiName];
            const number = schoolKpi.number;
            const countValue = (number !== null && number !== undefined && number !== '/' && !isNaN(parseFloat(number))) ? parseFloat(number) : null;
            const points = getPreviousAndCurrentPoints(schoolKpi.history, isUniversityDashboard ? schoolKpi : null);
            if(isMissingCurrentForKpi(kpiName, schoolKpi.percentage, schoolKpi.number, schoolKpi.applicable)) cardHasMissingReturns = true;
            const schoolWarning = createOutOfRangeBadge(schoolKpi.percentage, 'school-warning');
            const hasNoScope = countValue === null;
            const isExceeded = schoolKpi.exceeded === true;
            const hasNoCurrent = !isExceeded && (!points.current || isImplicitNoReturnPoint(kpiName, points.current) || (points.current.applicable !== false && typeof points.current.percentage !== 'number'));
            if(hasNoScope && hasNoCurrent){
              schoolBreakdownHtml += `<div class="compressed-school-row no-return-row"><div class="school-name">${schoolName}${schoolWarning}</div><div class="row-no-return-msg">No return submitted for this period</div></div>`;
            } else {
              const scopeText = getInScopeTextCompressed(kpiName, countValue, schoolKpi);
              const previousText = bandPercentCell(points.previous, kpiName, formatPercentCellCompressed(points.previous, kpiName, 'No prior applicable return'), 'prev');
              const currentText = bandPercentCell(points.current, kpiName, formatPercentCellCompressed(points.current, kpiName, 'No return'), 'current');
              const changeText = getCompressedChangeCell(schoolKpi.history, kpiName);
              const rowBand = (points.current && points.current.applicable !== false && typeof points.current.percentage === 'number' && !isImplicitNoReturnPoint(kpiName, points.current))
                ? BAND_INFO[getPerformanceClass(points.current.percentage, true)].cls : 'band-na';
              schoolBreakdownHtml += `<div class="compressed-school-row ${rowBand}"><div class="school-name">${schoolName}${schoolWarning}</div><div class="school-scope">${scopeText}</div><div class="school-prev num">${previousText}</div><div class="school-current num">${currentText}</div><div>${changeText}</div></div>`;
            }
          }
          schoolBreakdownHtml += '</div>';
        } else {
          schoolBreakdownHtml += '<div class="school-list">';
          for(const [schoolName, schoolData] of schoolEntries){
            const schoolKpi = schoolData.kpis[kpiName];
            const percentage = schoolKpi.percentage;
            const number = schoolKpi.number;
            const applicable = schoolKpi.applicable !== false;
            let barWidth = 0;
            let barColor = BAND_COLORS.neutral;
            let labelText = '';
            let isNumericLabel = false;
            let stateClass = '';

            const hasNumber = (number !== null && number !== undefined && number !== '/' && !isNaN(parseFloat(number)));
            const countValue = hasNumber ? parseFloat(number) : null;
            const hasZeroCount = countValue === 0;
            const zeroScoreText = getZeroScoreText(kpiName);
            const missingCurrent = isMissingCurrentForKpi(kpiName, percentage, number, applicable);

            if(missingCurrent){
              cardHasMissingReturns = true;
              labelText = '<span class="no-return">No return submitted</span>';
            } else if(!applicable){
              labelText = getNotApplicableText(kpiName);
            } else if(percentage === null || percentage === undefined || (typeof percentage === 'string' && percentage.trim() === '/')) {
              labelText = '<span class="no-return">No return submitted</span>';
            } else {
              const numericPercentage = parseFloat(percentage);
              if(!isNaN(numericPercentage)) {
                if(zeroScoreText && Math.abs(numericPercentage) < 1e-9) {
                  labelText = zeroScoreText;
                } else {
                  const boundedPercentage = Math.max(0, Math.min(100, numericPercentage));
                  if(hasZeroCount && !schoolKpi.exceeded) {
                    labelText = getNotApplicableText(kpiName);
                  } else if(hasZeroCount && schoolKpi.exceeded) {
                    const excLabel = kpiMeta[kpiName] && kpiMeta[kpiName].denominator_label ? kpiMeta[kpiName].denominator_label : 'items';
                    labelText = schoolKpi.completed_count !== null
                      ? `Activity reported (0 ${excLabel} scheduled, ${schoolKpi.completed_count} carried out)`
                      : `Activity reported (0 ${excLabel} scheduled)`;
                    stateClass = 'state-exceeded';
                  } else {
                    barWidth = boundedPercentage;
                    const schoolPerfClass = getPerformanceClass(numericPercentage, true);
                    switch(schoolPerfClass){
                      case 'performance-excellent': barColor = BAND_COLORS.excellent; break;
                      case 'performance-good': barColor = BAND_COLORS.good; break;
                      case 'performance-warning': barColor = BAND_COLORS.warning; break;
                      case 'performance-poor': barColor = BAND_COLORS.poor; break;
                      default: barColor = BAND_COLORS.neutral;
                    }
                    labelText = `${numericPercentage.toFixed(1)}%`;
                    isNumericLabel = true;
                  }
                }
              } else {
                labelText = '<span class="no-return">No return submitted</span>';
              }
            }

            if(labelText === '') labelText = '<span class="no-return">No return submitted</span>';

            const schoolLabel = (kpiMeta[kpiName] && kpiMeta[kpiName].denominator_label) ? kpiMeta[kpiName].denominator_label : 'records';
            const countDisplay = countValue !== null ? `<div class="school-count">${Math.round(countValue)} ${schoolLabel} in scope</div>` : '';
            const schoolTrendHtml = createSchoolTrendMarkup(schoolKpi.history, kpiName, schoolName);
            const measureHtml = isNumericLabel
              ? `<div class="bar-track"><div class="bar-fill" style="width:${barWidth}%;background:${barColor};"></div></div><span class="bar-value num">${labelText}</span>`
              : `<span class="school-state ${stateClass}">${labelText}</span>`;

            const schoolWarning = createOutOfRangeBadge(schoolKpi.percentage, 'school-warning');
            schoolBreakdownHtml += `<div class="school-row"><div><div class="school-name">${schoolName}${schoolWarning}</div>${countDisplay}</div><div class="school-measure">${measureHtml}</div><div class="school-trend">${schoolTrendHtml}</div></div>`;
          }
          schoolBreakdownHtml += '</div>';
        }

        schoolBreakdownHtml += '</div>';
      }
    }

    if(missingReturnsCount === 0 && cardHasMissingReturns) missingReturnsCount = 1;

    const trendHtml = currentViewMode === 'compressed' ? '' : createTrendMarkup(kpiData, kpiName);
    const hasExpandableContent = schoolBreakdownHtml !== '';
    const warningBadgeHtml = createOutOfRangeBadge(kpiData.percentage);
    const missingCardBadge = cardHasMissingReturns ? `<span class="missing-return-flag" title="${escapeHtml(DASHBOARD_CONFIG.unitTitle)} with no return for this KPI this period">${pluralise(missingReturnsCount, 'missing return', 'missing returns')}</span>` : '';
    const comparisonHtml = createUniversityComparison(kpiName, kpiData);
    const questionText = (kpiMeta[kpiName] && kpiMeta[kpiName].question) ? kpiMeta[kpiName].question : '';
    const hero = buildHeroMarkup(kpiName, kpiData, performanceClass);
    const meterHtml = buildMeterMarkup(kpiData, performanceClass);
    const unitWord = schoolCount === 1 ? DASHBOARD_CONFIG.unitSingular : DASHBOARD_CONFIG.unitPlural;
    const footerHtml = hasExpandableContent
      ? `<div class="card-footer"><button type="button" class="expand-btn" aria-expanded="false" aria-label="Show or hide ${escapeHtml(DASHBOARD_CONFIG.unitSingular)} breakdown for ${escapeHtml(kpiName)}"><span class="expand-text"><span class="when-closed">Show ${schoolCount} ${escapeHtml(unitWord)}</span><span class="when-open">Hide breakdown</span></span><span class="chev" aria-hidden="true">▾</span></button></div>`
      : (currentViewMode === 'compressed' ? '<div class="card-footer"></div>' : '<div class="card-footer-spacer"></div>');
    const flags = `<span class="kpi-flags">${warningBadgeHtml}${missingCardBadge}</span>`;

    if(currentViewMode === 'compressed') {
      card.innerHTML = `<div class="kpi-title-wrap"><span class="kpi-title">${kpiName}</span>${createKpiInfoButton(kpiName, true)}${flags}</div><div class="kpi-hero-wrap">${hero.html}</div>${comparisonHtml}${footerHtml}${schoolBreakdownHtml}`;
    } else {
      card.innerHTML = `<div class="kpi-head"><div class="kpi-title-wrap"><h3 class="kpi-title">${kpiName}</h3>${flags}</div>${createKpiInfoButton(kpiName)}</div><div class="kpi-question">${questionText}</div><div class="kpi-body"><div class="kpi-hero-wrap">${hero.html}</div><div class="kpi-deltas">${comparisonHtml}</div></div>${meterHtml}${trendHtml}${footerHtml}${schoolBreakdownHtml}`;
    }
    if(hasExpandableContent) {
      card.onclick = (event) => {
        if(event.target.closest('.info-btn')) return;
        if(event.target.closest('.school-breakdown-content') && !event.target.closest('.expand-btn')) return;
        toggleCard(card, kpiName);
      };
    } else {
      card.style.cursor = 'default';
      card.onclick = null;
    }

    facultyKpisContainer.appendChild(card);
  }
}
document.addEventListener('keydown', (event) => { if(event.key === 'Escape') closeInfoDialog(); });
renderHeaderMeta();
renderSummary();
refreshDashboard();
window.addEventListener('resize', () => { setTimeout(() => { renderTrendCharts(); renderSchoolTrendCharts(); }, 100); });

</script>
